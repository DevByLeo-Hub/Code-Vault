<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Árvore Original Multicolorida (Cores Puras) - Gravação</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000000;
    }
    canvas {
      cursor: crosshair;
      display: block;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <script type="module">
    import * as THREE from 'three';
    import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const settings = {
      iterations: 14,
      rules: {
        'X': 'F[-FY][+FY]',
        'Y': 'F[&FX][^FX]'
      },
      axiom: 'FFFX',
      branchBaseColor: '#050505', 
      sceneBGColor: '#000000',    
      flow: true,
      flowDirection: 1,
      flowSpeed: 1,
      pulseWidth: 1.3,
      pulseInterval: 3,
      minAngle: 15, 
      maxAngle: 35,
      coneFactor: 0.9,
      initialLength: 1.2,
      minLengthFactor: 0.2,
      maxLengthFactor: 0.8,
      initialThickness: 0.75,
      thicknessFactor: 0.85
    };

    const { degToRad, randFloat } = THREE.MathUtils;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(settings.sceneBGColor);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 40); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 15, 0); 
    controls.enablePan = false;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.strength = 0.05;  
    bloomPass.radius = 0.1;      
    bloomPass.threshold = 0.5;   
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    const flowingLightMaterial = new THREE.ShaderMaterial({
      defines: { FLOW_UPSTREAM: settings.flowDirection === 1 },
      uniforms: {
        uTime: { value: 0 },
        uFlowSpeed: { value: settings.flowSpeed },
        uPulseWidth: { value: settings.pulseWidth },
        uPulseInterval: { value: settings.pulseInterval },
        uBaseColor: { value: new THREE.Color(settings.branchBaseColor) },
        uHueOffset: { value: 0.0 }
      },
      vertexShader: `
        attribute float aProgress;
        varying float vProgress;
        varying vec3 vWorldPosition;
        
        void main() {
          vProgress = aProgress;
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uFlowSpeed;
        uniform float uPulseWidth;
        uniform float uPulseInterval;
        uniform vec3 uBaseColor;
        uniform float uHueOffset;

        varying float vProgress;
        varying vec3 vWorldPosition;

        // Converte matiz para RGB mantendo a cor pura
        vec3 hsl2rgb(vec3 c) {
            vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
            return c.z + c.y * (rgb - 0.5) * (1.0 - abs(2.0 * c.z - 1.0));
        }

        void main() {
          #ifdef FLOW_UPSTREAM
            float wave = mod(vProgress - uTime * uFlowSpeed, uPulseInterval);
          #else
            float wave = mod(vProgress + uTime * uFlowSpeed, uPulseInterval);
          #endif
          
          float pulse = smoothstep(uPulseInterval - uPulseWidth, uPulseInterval, wave);
          
          // Calcula a cor pura baseada na altura e tempo
          float hue = fract(vProgress * 0.15 + vWorldPosition.y * 0.015 - uTime * 0.15 + uHueOffset);
          // O valor 0.5 no final assegura que a cor seja 100% vibrante e pura (sem esbranquiçar)
          vec3 multiColor = hsl2rgb(vec3(hue, 1.0, 0.5));

          // Retirado o multiplicador exagerado de luz
          vec3 finalColor = mix(uBaseColor, multiColor, pulse);
          
          gl_FragColor = vec4(finalColor, 1.0);
        }
      `
    });

    let currentAxiom = settings.axiom;
    for (let i = 0; i < settings.iterations; i++) {
      currentAxiom = currentAxiom.split('').map(char => settings.rules[char] || char).join('');
    }

    function generateLSystemTree(string) {
      const geometries = [];
      const stateStack = [];

      let position = new THREE.Vector3(0, 0, 0);
      let direction = new THREE.Vector3(0, 1, 0);
      let currentProgress = 0.0;

      for (let i = 0; i < string.length; i++) {
        const char = string[i];

        if (char === 'F') {
          const lengthFactor = Math.max(0.2, 1.0 - (currentProgress * randFloat(settings.minLengthFactor, settings.maxLengthFactor)));
          const currentLength = settings.initialLength * lengthFactor;
          const nextPosition = position.clone().addScaledVector(direction, currentLength);
          const distance = position.distanceTo(nextPosition);

          const radiusFactor = Math.max(0.1, 1.0 - (currentProgress * settings.thicknessFactor));
          const currentRadius = settings.initialThickness * radiusFactor;

          const cylinderGeo = new THREE.CylinderGeometry(currentRadius * settings.coneFactor, currentRadius, distance, 6);
          cylinderGeo.translate(0, distance / 2, 0);
          cylinderGeo.rotateX(Math.PI / 2);

          const quaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), direction.clone().normalize());
          cylinderGeo.applyQuaternion(quaternion);
          cylinderGeo.translate(position.x, position.y, position.z);

          const vertexCount = cylinderGeo.attributes.position.count;
          const progressArray = new Float32Array(vertexCount).fill(currentProgress);
          cylinderGeo.setAttribute('aProgress', new THREE.BufferAttribute(progressArray, 1));

          geometries.push(cylinderGeo);

          position.copy(nextPosition);
          currentProgress += 0.06;

        } else if (char === '+') {
          direction.applyAxisAngle(new THREE.Vector3(0, 0, 1), degToRad(randFloat(settings.minAngle, settings.maxAngle)));
        } else if (char === '-') {
          direction.applyAxisAngle(new THREE.Vector3(0, 0, 1), -degToRad(randFloat(settings.minAngle, settings.maxAngle)));
        } else if (char === '&') {
          direction.applyAxisAngle(new THREE.Vector3(1, 0, 0), degToRad(randFloat(settings.minAngle, settings.maxAngle)));
        } else if (char === '^') {
          direction.applyAxisAngle(new THREE.Vector3(1, 0, 0), -degToRad(randFloat(settings.minAngle, settings.maxAngle)));
        } else if (char === '[') {
          stateStack.push({ position: position.clone(), direction: direction.clone(), currentProgress: currentProgress });
        } else if (char === ']') {
          const state = stateStack.pop();
          position.copy(state.position);
          direction.copy(state.direction);
          currentProgress = state.currentProgress;
        }
      }

      const mergedGeometry = BufferGeometryUtils.mergeGeometries(geometries, true);
      const mesh = new THREE.Mesh(mergedGeometry, flowingLightMaterial);
      
      mesh.position.y = -5;
      
      return mesh;
    }

    let treeMesh = generateLSystemTree(currentAxiom);
    scene.add(treeMesh);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      flowingLightMaterial.uniforms.uTime.value = elapsedTime;

      if (treeMesh) {
        treeMesh.rotation.x = Math.sin(elapsedTime) / 3;
        treeMesh.rotation.z = Math.cos(elapsedTime * .5) / -3;
        treeMesh.rotation.y = elapsedTime * 0.2;
      }

      controls.update();
      composer.render();
    }
    renderer.domElement.addEventListener('click', () => {
      flowingLightMaterial.uniforms.uHueOffset.value += 0.25;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
