<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lâmpada Divertida Mente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="room" id="room" data-emotion="off">
        <div class="lamp">
            <div class="light"></div>

            <div class="shade-container">
                <div class="shade-bottom"></div>
                <div class="shade-body"></div>
                <div class="shade-top"></div>
                
                <div class="face">
                    <div class="blush left"></div>
                    <div class="blush right"></div>
                    
                    <div class="eye left"></div>
                    <div class="eye right">
                        <div class="tear"></div> 
                    </div>
                    
                    <div class="mouth"></div>
                </div>
            </div>

            <div class="cord" id="cord"></div>

            <div class="stem"></div>
            <div class="base"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
